<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget</title>
<meta name="theme-color" content="#2f7d5b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141815" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --text:#1f2a24; --muted:#6b756f; --line:#e7e3da; --soft:#efece5;
  --accent:#2f7d5b; --on-accent:#ffffff; --accent-soft:#e3f1ea;
  --good:#2f7d5b; --warn:#c9862b; --danger:#c4473a;
  --shadow:0 6px 20px rgba(31,42,36,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121614; --card:#1b201d; --text:#ecefe9; --muted:#9aa39d; --line:#2b322e; --soft:#242a26;
    --accent:#5cc195; --on-accent:#0d1f16; --accent-soft:#1f3329;
    --good:#5cc195; --warn:#e3a54f; --danger:#ec7a6c;
    --shadow:0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}
.top-in{max-width:560px;margin:0 auto;padding:10px 16px 6px;display:flex;align-items:center;gap:8px}
.month{flex:1;display:flex;align-items:center;justify-content:center;gap:4px}
.month button{background:none;border:0;padding:8px 10px;border-radius:10px}
.month #prev,.month #next{font-size:22px;line-height:1;color:var(--muted)}
#monthLabel{font-weight:650;font-size:17px;min-width:150px}
.iconbtn{background:none;border:0;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active,.month button:active{background:var(--soft)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{max-width:560px;margin:0 auto;padding:4px 16px calc(120px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.card h3{margin:0 0 4px;font-size:15px;font-weight:650;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 .link{font-weight:500;font-size:14px;color:var(--accent);background:none;border:0;padding:0}

/* Hero */
.hero .label{font-size:14px;color:var(--muted)}
.hero .big{font-size:42px;font-weight:750;letter-spacing:-.02em;margin:2px 0 10px}
.hero .big.over{color:var(--danger)}
.hero .meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:8px;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;margin-top:10px;font-size:13px;padding:5px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:550}
.pill.over{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}

.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar.thick{height:12px}
.bar>i{display:block;height:100%;background:var(--good);border-radius:inherit;transition:width .3s}
.bar.warn>i{background:var(--warn)}
.bar.over>i{background:var(--danger)}

/* Rows */
.list{margin-top:4px}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list>.item:first-child{border-top:0}
.emoji{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--soft)}
.grow{flex:1;min-width:0}
.name{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap}
.amt.income{color:var(--good)}
.cat-row .bar{margin-top:6px}
.cat-row .line1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.left-good{color:var(--muted)} .left-warn{color:var(--warn)} .left-over{color:var(--danger);font-weight:600}

.day{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:18px 2px 0;font-weight:550}
.day:first-of-type{margin-top:6px}

.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.check svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.status{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.status.paid{background:var(--accent-soft);color:var(--accent)}
.status.soon{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.status.late{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}

/* Filter chips */
.filters{display:flex;gap:8px;overflow-x:auto;padding:6px 0 2px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:14px;white-space:nowrap}
.fchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* Charts */
.chart-wrap{display:flex;gap:16px;align-items:center;margin-top:8px}
.donut{width:150px;height:150px;flex:none}
.donut text{fill:var(--text);font-family:inherit}
.legend{flex:1;min-width:0;font-size:13px;display:grid;gap:6px}
.legend div{display:flex;align-items:center;gap:6px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars svg{width:100%;height:auto;display:block;margin-top:8px}
.bars text{fill:var(--muted);font-size:10px;font-family:inherit}
@media (max-width:380px){.chart-wrap{flex-direction:column;align-items:stretch}.donut{margin:0 auto}}

/* Goals */
.goal .top-line{display:flex;align-items:center;gap:12px}
.goal .bar{margin:12px 0 8px}
.goal .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:550;white-space:nowrap;flex:none}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn:active{transform:scale(.98)}

.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty .e{font-size:38px;margin-bottom:6px}
.empty .btn{margin-top:12px}

/* FAB + tab bar */
#fab{position:fixed;z-index:6;right:max(16px,calc(50% - 264px));bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:0;box-shadow:var(--shadow),0 2px 6px rgba(0,0,0,.15);display:grid;place-items:center}
#fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
#fab:active{transform:scale(.95)}
.tabbar{position:fixed;z-index:6;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:560px;margin:0 auto;display:flex}
.tabbar button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0 10px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.on{color:var(--accent);font-weight:600}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;overscroll-behavior:contain}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:19px;margin:4px 0 14px}
.sheet h4{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 0 6px}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px}
.field input:focus,.field select:focus,.money-in:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .field{margin:12px 0 0}
.money-in{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.money-in span{font-size:28px;color:var(--muted);font-weight:600}
.money-in input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:34px;font-weight:700;color:var(--text);padding:6px 0}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:550;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:14px;background:var(--card)}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .spacer{flex:1}
.emoji-in{width:64px!important;text-align:center;font-size:22px!important}
.set-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px}

#toast{position:fixed;z-index:30;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#syncBtn[data-s=synced]{color:var(--accent)}
#syncBtn[data-s=pending],#syncBtn[data-s=connecting]{color:var(--warn)}
#syncBtn[data-s=offline]{color:var(--muted)}
#syncBtn[data-s=signedout],#syncBtn[data-s=denied]{color:var(--danger)}
.brk{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);margin-top:6px}
.brk.total{color:var(--text);font-weight:600}
.payrow{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.payrow b{font-size:18px}
.banner{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-color:transparent}
.banner .grow b{display:block}
.err{color:var(--danger);font-size:14px;min-height:20px;margin-top:8px}
.linkbtn{background:none;border:0;color:var(--accent);padding:6px 0;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="iconbtn" id="syncBtn" hidden aria-label="Sync">
      <svg class="i" viewBox="0 0 24 24"><path d="M7 18.5h10.5a4 4 0 0 0 .4-7.98A6 6 0 0 0 6.3 9.6 4.5 4.5 0 0 0 7 18.5z"/><path id="syncMark" d=""/></svg>
    </button>
    <div class="iconbtn" id="syncSpacer" aria-hidden="true"></div>
    <div class="month">
      <button id="prev" aria-label="Previous pay period">‹</button>
      <button id="monthLabel" class="num" title="Jump to this pay period"></button>
      <button id="next" aria-label="Next pay period">›</button>
    </div>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
    </button>
  </div>
</header>

<main id="main"></main>

<button id="fab" aria-label="Add expense"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabbar">
  <div class="tabbar-in">
    <button data-tab="overview"><svg class="i" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Overview</button>
    <button data-tab="spending"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Spending</button>
    <button data-tab="bills"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Bills</button>
    <button data-tab="goals"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>Goals</button>
  </div>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="firebase-config.js"></script>
<script src="sync.js"></script>
<script>
'use strict';
/* ---------- Storage ---------- */
const KEY = 'budget-app-v1';
const PALETTE = ['#2f7d5b','#d08a2e','#3d74b8','#c4473a','#8a5cb8','#2a9d9b','#c2649a','#7a8b3a','#9a7b5f','#5b6bd1','#d4693a','#4f8f6f'];
const DEFAULT_CATS = [
  ['Groceries','🛒',600],['Dining out','🍽️',200],['Gas & transport','⛽',250],['Bills & utilities','🧾',500],
  ['Household','🏠',150],['Shopping','🛍️',150],['Fun','🎉',100],['Health','💊',100],['Other','📦',100]
];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);

function defaults() {
  return {
    version: 1,
    settings: { currency: 'USD' },
    categories: DEFAULT_CATS.map(([name, emoji, limit], i) => ({ id: uid(), name, emoji, limit, color: PALETTE[i % PALETTE.length] })),
    transactions: [], bills: [], goals: []
  };
}
function normalize(d) {
  const base = defaults();
  return {
    version: 1,
    settings: { ...base.settings, ...(d.settings || {}) },
    categories: Array.isArray(d.categories) ? d.categories : base.categories,
    transactions: Array.isArray(d.transactions) ? d.transactions : [],
    bills: Array.isArray(d.bills) ? d.bills : [],
    goals: Array.isArray(d.goals) ? d.goals : []
  };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.categories)) return normalize(d); }
  } catch (e) {}
  return defaults();
}
let db = load();
function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch (e) { return false; }
}
function save() {
  const ok = saveLocal();
  if (typeof Sync !== 'undefined' && Sync.live) Sync.push();
  else if (!ok) toast("Couldn't save on this device. Use Settings → Back up.");
}
// Look an item up again at save time: the other phone may have replaced it while a form was open.
const fresh = (list, item) => item && db[list].find(x => x.id === item.id);

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const thisMonth = () => monthKey(new Date());
function shiftMonth(ym, n) { const [y, m] = ym.split('-').map(Number); return monthKey(new Date(y, m - 1 + n, 1)); }
function daysInMonth(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function monthLabel(ym, opt) { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, opt || { month: 'long', year: 'numeric' }); }
function money(n, whole) {
  try {
    return new Intl.NumberFormat(undefined, { style: 'currency', currency: db.settings.currency,
      minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 }).format(n || 0);
  } catch (e) { return '$' + (n || 0).toFixed(whole ? 0 : 2); }
}
function curSym() {
  try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: db.settings.currency }).formatToParts(0).find(p => p.type === 'currency').value; }
  catch (e) { return '$'; }
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function parseAmt(v) {
  let s = String(v ?? '').trim().replace(/[^0-9.,]/g, '');
  if (s.includes('.') && s.includes(',')) s = s.replace(/,/g, '');
  else if (/,\d{1,2}$/.test(s)) s = s.replace(',', '.');
  else s = s.replace(/,/g, '');
  const n = parseFloat(s);
  return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
}
function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
const UNCAT = { id: null, name: 'Uncategorized', emoji: '❔', limit: 0, color: '#8a8f8b' };
const cat = id => db.categories.find(c => c.id === id) || UNCAT;
/* ---------- Pay periods (every 2 weeks from an anchor Monday) ---------- */
const DEFAULT_ANCHOR = '2026-11-23';
const PERIOD_DAYS = 14;
const dayNum = iso => { const [y, m, d] = iso.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const fromDayNum = n => new Date(n * 864e5).toISOString().slice(0, 10);
const todayISO = () => isoDate(new Date());
const anchor = () => db.settings.payAnchor || DEFAULT_ANCHOR;
function periodOf(iso) { const a = dayNum(anchor()); return fromDayNum(a + Math.floor((dayNum(iso) - a) / PERIOD_DAYS) * PERIOD_DAYS); }
const thisPeriod = () => periodOf(todayISO());
const shiftPeriod = (pk, n) => fromDayNum(dayNum(pk) + n * PERIOD_DAYS);
const periodEnd = pk => fromDayNum(dayNum(pk) + PERIOD_DAYS - 1);
const inPeriod = (iso, pk) => iso >= pk && iso <= periodEnd(pk);
function shortDate(iso, opt) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, opt || { month: 'short', day: 'numeric' }); }
function periodLabel(pk) {
  const end = periodEnd(pk), yr = String(new Date().getFullYear());
  return `${shortDate(pk)} – ${shortDate(end, end.slice(0, 4) !== yr ? { month: 'short', day: 'numeric', year: 'numeric' } : undefined)}`;
}

const txIn = pk => { const e = periodEnd(pk); return db.transactions.filter(t => t.date && t.date >= pk && t.date <= e); };
const spentIn = (pk, catId) => txIn(pk).filter(t => t.type !== 'income' && (catId === undefined || t.catId === catId)).reduce((s, t) => s + t.amount, 0);

/* ---------- Paycheck calculator ---------- */
// 2026 federal brackets and standard deduction (IRS Rev. Proc. 2025-32)
const BRACKETS = {
  single:  { std: 16100, b: [[12400, .10], [50400, .12], [105700, .22], [201775, .24], [256225, .32], [640600, .35], [Infinity, .37]] },
  married: { std: 32200, b: [[24800, .10], [100800, .12], [211400, .22], [403550, .24], [512450, .32], [768700, .35], [Infinity, .37]] },
  hoh:     { std: 24150, b: [[17700, .10], [67450, .12], [105700, .22], [201750, .24], [256200, .32], [640600, .35], [Infinity, .37]] }
};
function fedTaxAnnual(income, filing) {
  const t = BRACKETS[filing] || BRACKETS.single;
  let x = Math.max(0, income - t.std), prev = 0, tax = 0;
  for (const [cap, rate] of t.b) { if (x <= prev) break; tax += (Math.min(x, cap) - prev) * rate; prev = cap; }
  return tax;
}
const PAY_DEFAULTS = { rate: 0, hours: 80, otHours: 0, otMult: 1.5, filing: 'single', retirePct: 0, pretax: 0, statePct: 0, fedPct: null, extraFed: 0, posttax: 0 };
const pay = () => ({ ...PAY_DEFAULTS, ...(db.settings.pay || {}) });
const payConfigured = () => pay().rate > 0;
function hoursFor(pk) { const p = pay(), o = (db.settings.periodHours || {})[pk]; return { hours: o?.hours ?? p.hours, otHours: o?.otHours ?? p.otHours, custom: !!o }; }
function calcPay(p, h) {
  const r2 = n => Math.round(n * 100) / 100;
  const regular = p.rate * h.hours, overtime = p.rate * p.otMult * h.otHours, gross = regular + overtime;
  const retire = gross * p.retirePct / 100, pretax = Math.min(p.pretax, Math.max(0, gross - retire));
  const fedWages = Math.max(0, gross - retire - pretax), ficaWages = Math.max(0, gross - pretax);
  const fedEstimated = p.fedPct === null || p.fedPct === '' || isNaN(p.fedPct);
  const fed = (fedEstimated ? fedTaxAnnual(fedWages * 26, p.filing) / 26 : fedWages * p.fedPct / 100) + (+p.extraFed || 0);
  const ss = ficaWages * .062, med = ficaWages * .0145, state = fedWages * p.statePct / 100;
  const net = gross - retire - pretax - fed - ss - med - state - p.posttax;
  return { regular: r2(regular), overtime: r2(overtime), gross: r2(gross), retire: r2(retire), pretax: r2(pretax), fed: r2(fed), fedEstimated,
    ss: r2(ss), med: r2(med), state: r2(state), posttax: r2(p.posttax), net: r2(Math.max(0, net)) };
}
// What this pay period has to spend: the real check if logged, otherwise the estimate.
function paycheckFor(pk) {
  const inc = txIn(pk).filter(t => t.type === 'income');
  const checks = inc.filter(t => t.paycheck), other = inc.filter(t => !t.paycheck).reduce((s, t) => s + t.amount, 0);
  if (checks.length) return { amount: checks.reduce((s, t) => s + t.amount, 0), kind: 'actual', other, tx: checks };
  if (payConfigured()) return { amount: calcPay(pay(), hoursFor(pk)).net, kind: 'estimate', other };

}
const totalBudget = () => db.categories.reduce((s, c) => s + (+c.limit || 0), 0);
const level = (spent, limit) => !limit ? (spent > 0 ? 'over' : 'good') : spent > limit ? 'over' : spent / limit >= .85 ? 'warn' : 'good';
const soft = hex => hex + '24';
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- State ---------- */
const state = { tab: 'overview', pk: thisPeriod(), filterCat: null };
try { const t = localStorage.getItem(KEY + ':tab'); if (['overview', 'spending', 'bills', 'goals'].includes(t)) state.tab = t; } catch (e) {}

/* ---------- Bills logic ---------- */
function billTx(b, ym) { const id = b.paid && b.paid[ym]; return id ? db.transactions.find(t => t.id === id) : null; }
const billDate = (b, ym) => `${ym}-${pad(Math.min(b.dueDay, daysInMonth(ym)))}`;
// The bill's due date inside this pay period, or else its next due date after it.
function billOcc(b, pk) {
  const end = periodEnd(pk);
  for (const ym of new Set([pk.slice(0, 7), end.slice(0, 7)])) {
    const d = billDate(b, ym);
    if (d >= pk && d <= end) return { ym, date: d, inPeriod: true };
  }
  let ym = end.slice(0, 7);
  if (billDate(b, ym) <= end) ym = shiftMonth(ym, 1);
  return { ym, date: billDate(b, ym), inPeriod: false };
}
function billStatus(b, occ) {
  if (billTx(b, occ.ym)) return { cls: 'paid', text: 'Paid' };
  const diff = dayNum(occ.date) - dayNum(todayISO());
  if (diff < 0) return { cls: 'late', text: diff < -20 ? 'Not paid' : `${-diff}d overdue` };
  if (diff === 0) return { cls: 'soon', text: 'Due today' };
  if (diff <= 5) return { cls: 'soon', text: `Due in ${diff}d` };
  return { cls: '', text: 'Due ' + shortDate(occ.date, { weekday: 'short', month: 'short', day: 'numeric' }) };
}
function toggleBill(id) {
  const b = db.bills.find(x => x.id === id); if (!b) return;
  const { ym, date } = billOcc(b, state.pk);
  b.paid = b.paid || {};
  const t = billTx(b, ym);
  if (t) {
    db.transactions = db.transactions.filter(x => x.id !== t.id);
    delete b.paid[ym];
    toast(`${b.name} marked unpaid`);
  } else {
    const tx = { id: uid(), type: 'expense', amount: b.amount, catId: b.catId, date, note: b.name, billId: b.id };
    db.transactions.push(tx);
    b.paid[ym] = tx.id;
    toast(`${b.name} paid · added to spending`);
  }
  save(); render();
}

/* ---------- Charts ---------- */
function donutSVG(items, total) {
  let acc = 0;
  const segs = items.map(it => {
    const p = it.value / total * 100;
    const s = `<circle r="15.915" cx="21" cy="21" fill="none" stroke="${it.color}" stroke-width="5.5" stroke-dasharray="${p.toFixed(3)} ${(100 - p).toFixed(3)}" stroke-dashoffset="${(25 - acc).toFixed(3)}"/>`;
    acc += p; return s;
  }).join('');
  return `<svg class="donut" viewBox="0 0 42 42" role="img" aria-label="Spending by category">
    <circle r="15.915" cx="21" cy="21" fill="none" stroke="var(--soft)" stroke-width="5.5"/>${segs}
    <text x="21" y="21.5" text-anchor="middle" font-size="5.2" font-weight="700">${esc(money(total, true))}</text>
    <text x="21" y="27" text-anchor="middle" font-size="3.2" style="fill:var(--muted)">spent</text></svg>`;
}
function barsSVG(endPk) {
  const periods = [5, 4, 3, 2, 1, 0].map(n => shiftPeriod(endPk, -n));
  const vals = periods.map(p => spentIn(p));
  const budget = totalBudget();
  const max = Math.max(budget, ...vals, 1) * 1.08;
  const W = 300, H = 150, top = 8, bottom = 126, bw = 30, gap = (W - bw * 6) / 6;
  const y = v => bottom - (v / max) * (bottom - top);
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending over the last six pay periods">`;
  out += `<line x1="0" x2="${W}" y1="${bottom}" y2="${bottom}" stroke="var(--line)"/>`;
  periods.forEach((m, i) => {
    const x = gap / 2 + i * (bw + gap), v = vals[i], over = budget && v > budget;
    const h = Math.max(bottom - y(v), v > 0 ? 2 : 0);
    const color = over ? 'var(--danger)' : 'var(--accent)';
    out += `<rect x="${x}" y="${bottom - h}" width="${bw}" height="${h}" rx="5" fill="${color}" opacity="${m === endPk ? 1 : .45}"><title>${esc(periodLabel(m))}: ${esc(money(v))}</title></rect>`;
    out += `<text x="${x + bw / 2}" y="${bottom + 16}" text-anchor="middle" ${m === endPk ? 'style="fill:var(--text);font-weight:600"' : ''}>${esc(shortDate(m))}</text>`;
    if (v > 0) out += `<text x="${x + bw / 2}" y="${bottom - h - 4}" text-anchor="middle" font-size="9">${esc(compact(v))}</text>`;
  });
  if (budget) out += `<line x1="0" x2="${W}" y1="${y(budget)}" y2="${y(budget)}" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".7"/>`;
  return out + '</svg>';
}
function compact(v) {
  try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: db.settings.currency, notation: 'compact', maximumFractionDigits: 1 }).format(v); }
  catch (e) { return Math.round(v); }
}

/* ---------- Views ---------- */
function viewOverview() {
  const ym = state.pk, spent = spentIn(ym), budget = totalBudget();
  const pc = paycheckFor(ym), moneyIn = pc.amount + pc.other;
  const base = pc.kind === 'none' ? budget : moneyIn, left = base - spent;
  const pct = base ? Math.min(100, spent / base * 100) : (spent ? 100 : 0), lv = level(spent, base);
  const isCur = ym === thisPeriod();
  let pill = '';
  if (left < 0) pill = `<span class="pill over">${money(-left)} over ${pc.kind === 'none' ? 'budget' : 'this paycheck'}</span>`;
  else if (isCur && base) { const dl = dayNum(periodEnd(ym)) - dayNum(todayISO()) + 1; pill = `<span class="pill">${dl} day${dl > 1 ? 's' : ''} left · about ${money(left / dl, true)} a day</span>`; }

  let payRow;
  if (pc.kind === 'actual') payRow = `<div class="payrow"><div class="grow"><div class="sub">Paycheck · received</div><b class="num">${money(pc.amount)}</b></div>
      <button class="btn sm" data-act="edit-tx" data-id="${pc.tx[0].id}">Edit</button></div>`;
  else if (pc.kind === 'estimate') payRow = `<div class="payrow"><div class="grow"><div class="sub">Paycheck · estimated${hoursFor(ym).custom ? ' (custom hours)' : ''}</div><b class="num">${money(pc.amount)}</b></div>
      <button class="btn sm" data-act="pay-calc">Adjust</button><button class="btn sm primary" data-act="got-paid">I got paid</button></div>`;
  else payRow = `<div class="payrow"><div class="grow"><div class="sub">Base the budget on your paycheck</div></div>
      <button class="btn sm" data-act="got-paid">Enter check</button><button class="btn sm primary" data-act="pay-calc">Set up</button></div>`;
  let planNote = '';
  if (pc.kind !== 'none' && budget) {
    const diff = moneyIn - budget;
    planNote = `<div class="meta num small"><span>Category budgets ${money(budget, true)}</span><span class="${diff < 0 ? 'left-over' : ''}">${diff < 0 ? `${money(-diff, true)} more than you make` : `${money(diff, true)} unbudgeted`}</span></div>`;
  }

  let h = syncBanner() + `<section class="card hero">
    <div class="label">${left < 0 ? 'Over' : 'Left to spend'} · ${esc(periodLabel(ym))}</div>
    <div class="big num ${left < 0 ? 'over' : ''}">${money(Math.abs(left))}</div>
    <div class="bar thick ${lv}"><i style="width:${pct}%"></i></div>
    <div class="meta num"><span>Spent ${money(spent)}</span><span>${pc.kind === 'none' ? 'Budget' : 'Money in'} ${money(base)}</span></div>
    ${pc.other ? `<div class="meta num"><span>Other income</span><span style="color:var(--good)">${money(pc.other)}</span></div>` : ''}
    ${planNote}
    ${payRow}
    ${pill}</section>`;

  // Bills due this pay period

    const due = db.bills.map(b => ({ b, occ: billOcc(b, ym) })).filter(x => x.occ.inPeriod).sort((a, b) => a.occ.date.localeCompare(b.occ.date));
    const unpaid = due.filter(x => !billTx(x.b, x.occ.ym));
    h += `<section class="card"><h3>Bills this pay period <button class="link" data-act="tab" data-tab="bills">${due.length - unpaid.length} of ${due.length} paid ›</button></h3>`;
    if (!due.length) h += `<div class="sub" style="padding:6px 0">No bills due this pay period.</div>`;
    else if (!unpaid.length) h += `<div class="sub" style="padding:6px 0">All paid 🎉</div>`;
    else h += `<div class="list">${unpaid.slice(0, 3).map(x => billRow(x.b, ym)).join('')}</div>`;
    h += `</section>`;
  }

  // Categories

  const uncat = spentIn(ym, null) + txIn(ym).filter(t => t.type !== 'income' && t.catId && !db.categories.some(c => c.id === t.catId)).reduce((s, t) => s + t.amount, 0);

  h += cats.map(c => {
    const s = c._spent ?? spentIn(ym, c.id), lim = +c.limit || 0, l = level(s, lim);

    return `<button class="item cat-row" data-act="filter" data-id="${c.id ?? ''}">
      <div class="emoji" style="background:${soft(c.color)}">${esc(c.emoji)}</div>
      <div class="grow"><div class="line1"><span class="name">${esc(c.name)}</span><span class="small num left-${l}">${remTxt}</span></div>
      <div class="bar ${l}"><i style="width:${p}%"></i></div>
      <div class="sub num" style="margin-top:3px">${money(s)}${lim ? ` of ${money(lim, true)}` : ''}</div></div></button>`;
  }).join('');
  h += `</div></section>`;

  // Charts

      `<div><span class="sw" style="background:${i.color}"></span><span class="lname">${esc(i.name)}</span><span class="num muted">${Math.round(i.value / spent * 100)}%</span></div>`).join('')}
      ${items.length > 7 ? `<div class="muted">+${items.length - 7} more</div>` : ''}</div></div>`;
  h += `</section>`;

function billRow(b, pk) {

function viewSpending() {
  const ym = state.pk;
  let list = txIn(ym);
  const usedCats = db.categories.filter(c => list.some(t => t.catId === c.id));
  if (state.filterCat === 'income') list = list.filter(t => t.type === 'income');
  else if (state.filterCat === 'none') list = list.filter(t => t.type !== 'income' && !db.categories.some(c => c.id === t.catId));
  else if (state.filterCat) list = list.filter(t => t.catId === state.filterCat && t.type !== 'income');
  list.sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));

  const spent = list.filter(t => t.type !== 'income').reduce((s, t) => s + t.amount, 0);
  const inc = list.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const hasIncome = txIn(ym).some(t => t.type === 'income');
  const hasUncat = txIn(ym).some(t => t.type !== 'income' && !db.categories.some(c => c.id === t.catId));
  const f = state.filterCat;
  let h = `<div class="filters">
    <button class="fchip ${!f ? 'on' : ''}" data-act="filter-chip" data-id="">All</button>
    ${usedCats.map(c => `<button class="fchip ${f === c.id ? 'on' : ''}" data-act="filter-chip" data-id="${c.id}">${esc(c.emoji)} ${esc(c.name)}</button>`).join('')}
    ${hasUncat ? `<button class="fchip ${f === 'none' ? 'on' : ''}" data-act="filter-chip" data-id="none">❔ Uncategorized</button>` : ''}
    ${hasIncome ? `<button class="fchip ${f === 'income' ? 'on' : ''}" data-act="filter-chip" data-id="income">💵 Income</button>` : ''}
  </div>`;
  if (f && f !== 'income' && f !== 'none' && !usedCats.some(c => c.id === f)) {
    const c = cat(f);
    h = h.replace('</div>', `<button class="fchip on" data-act="filter-chip" data-id="${c.id}">${esc(c.emoji)} ${esc(c.name)}</button></div>`);
  }

  h += `<section class="card"><div class="meta num" style="display:flex;justify-content:space-between;gap:8px">
    <div><div class="sub">Spent</div><div style="font-size:24px;font-weight:700">${money(spent)}</div></div>
    ${inc ? `<div style="text-align:right"><div class="sub">Income</div><div style="font-size:24px;font-weight:700;color:var(--good)">${money(inc)}</div></div>` : ''}
    ${f && f !== 'income' && f !== 'none' && cat(f).limit ? `<div style="text-align:right"><div class="sub">Budget</div><div style="font-size:24px;font-weight:700">${money(cat(f).limit, true)}</div></div>` : ''}
  </div></section>`;

  if (!list.length) return h + `<div class="empty"><div class="e">🧾</div>Nothing logged here this pay period.<br><button class="btn primary" data-act="add-tx">Add an expense</button></div>`;

  h += list.map(t => {
    let head = '';

      lastDate = t.date;
      const [y, m, d] = t.date.split('-').map(Number);
      const label = t.date === today ? 'Today' : t.date === yest ? 'Yesterday' : new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

      <div class="amt num ${inc ? 'income' : ''}">${inc ? '+' : ''}${money(t.amount)}</div></button>`;
  }).join('');
  return h;
}

    }
    return `<section class="card goal">
      <button class="top-line" data-act="edit-goal" data-id="${g.id}" style="background:none;border:0;padding:0;width:100%;text-align:left">

      <div class="foot"><span>${hint}</span><button class="btn sm" data-act="fund-goal" data-id="${g.id}">+ Add money</button></div></section>`;
  }).join('');

}

/* ---------- Sheet ---------- */
let lastFocus = null;
function openSheet(html) {
  lastFocus = document.activeElement;
  $('#sheetBody').innerHTML = html;
  $('#backdrop').classList.add('open'); $('#sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
  const auto = $('#sheetBody [autofocus]');

}
function closeSheet() {

const actions = (del) => `<div class="actions">${del ? `<button type="button" class="btn danger" data-del>Delete</button>` : ''}<span class="spacer"></span><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">Save</button></div>`;

const moneyInput = (name, val, auto) => `<div class="money-in"><span>${esc(curSym())}</span><input name="${name}" inputmode="decimal" placeholder="0.00" autocomplete="off" value="${val !== undefined && val !== null && val !== '' ? val : ''}" ${auto ? 'autofocus' : ''}></div>`;

/* Transaction */
function txForm(id) {
  const t = id ? db.transactions.find(x => x.id === id) : null;
  let type = t?.type || 'expense';
  const preCat = t?.catId ?? (state.filterCat && db.categories.some(c => c.id === state.filterCat) ? state.filterCat : null);
  const defDate = t?.date || (inPeriod(todayISO(), state.pk) ? todayISO() : state.pk);
  const root = openSheet(`<form id="f" autocomplete="off">
    <h2>${t ? 'Edit' : 'New'} ${type === 'income' ? 'income' : 'expense'}</h2>
    <div class="seg"><button type="button" data-type="expense">Expense</button><button type="button" data-type="income">Income</button></div>
    ${moneyInput('amount', t?.amount, !t)}
    <div class="field" id="catField"><span>Category</span><div class="chips">
      ${db.categories.map(c => `<label class="chip"><input type="radio" name="cat" value="${c.id}" ${c.id === preCat ? 'checked' : ''}><span>${esc(c.emoji)} ${esc(c.name)}</span></label>`).join('')}
    </div></div>
    <label class="chip" id="payChk" style="display:inline-block;margin-top:4px"><input type="checkbox" name="paycheck" ${t ? (t.paycheck ? 'checked' : '') : 'checked'}><span>💵 This is my paycheck</span></label>
    <div class="two"><label class="field"><span>Date</span><input type="date" name="date" value="${defDate}" required></label>
    <label class="field"><span>Note (optional)</span><input name="note" maxlength="80" placeholder="e.g. Target" value="${esc(t?.note || '')}"></label></div>
    ${t?.billId ? '<div class="note">This came from a bill. Deleting it marks the bill unpaid.</div>' : ''}
    ${actions(!!t)}</form>`);
  const f = root.querySelector('#f');
  const setType = ty => {
    type = ty;
    root.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.type === ty));
    root.querySelector('#catField').hidden = ty === 'income';
    root.querySelector('#payChk').hidden = ty !== 'income';
    root.querySelector('h2').textContent = `${t ? 'Edit' : 'New'} ${ty}`;
  };
  root.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setType(b.dataset.type)));
  setType(type);
  wireCommon(root, () => {
    if (!confirm('Delete this entry?')) return;
    db.transactions = db.transactions.filter(x => x.id !== t.id);
    save(); closeSheet(); render(); toast('Deleted');
  });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const amount = parseAmt(f.amount.value);
    if (!(amount > 0)) { toast('Enter an amount'); f.amount.focus(); return; }
    const catId = type === 'income' ? null : (f.querySelector('input[name=cat]:checked')?.value || null);
    if (type === 'expense' && !catId) { toast('Pick a category'); return; }
    const date = f.date.value || isoDate(new Date());
    const data = { type, amount, catId, date, note: f.note.value.trim(), paycheck: type === 'income' && f.paycheck.checked };
    const cur = fresh('transactions', t);
    if (cur) Object.assign(cur, data);
    else db.transactions.push(t ? { ...t, ...data } : { id: uid(), created: Date.now(), ...data });
    save(); closeSheet();
    if (!inPeriod(date, state.pk)) toast(`Saved to ${periodLabel(periodOf(date))}`);
    else if (!t && type === 'expense') {
      const c = cat(catId), rem = (+c.limit || 0) - spentIn(state.pk, catId);
      toast(c.limit ? (rem >= 0 ? `${money(rem, true)} left in ${c.name}` : `${c.name} is ${money(-rem, true)} over`) : 'Saved');
    } else toast('Saved');
    render();
  });
}

  const f = root.querySelector('#f');

    g = fresh('goals', g);
    if (!g) { closeSheet(); toast('That goal was deleted on the other phone'); return; }
    const before = g.saved || 0;
    g.saved = Math.max(0, Math.round((before + sign * a) * 100) / 100);
    save(); closeSheet(); render();
    toast(sign > 0 && g.saved >= g.target && before < g.target ? `🎉 You reached ${g.name}!` : sign > 0 ? `Added ${money(a)}` : `Took out ${money(a)}`);
  };
  wireCommon(root);
  root.querySelector('[data-withdraw]').onclick = () => apply(-1);
  f.addEventListener('submit', e => { e.preventDefault(); apply(1); });
}

  const est = pc.kind === 'estimate' ? pc.amount : '';
  const root = openSheet(`<form id="f" autocomplete="off"><h2>I got paid 💵</h2>
    <div class="sub" style="margin-top:-8px">Enter the take-home amount from your check. It replaces the estimate for this pay period.</div>
    <div class="field">${moneyInput('amount', est, true)}</div>
    <label class="field"><span>Date received</span><input type="date" name="date" value="${inPeriod(todayISO(), pk) ? todayISO() : pk}" required></label>
    ${actions(false)}</form>`);
  const f = root.querySelector('#f');
  wireCommon(root);
  f.addEventListener('submit', e => {
    e.preventDefault();
    const amount = parseAmt(f.amount.value);
    if (!(amount > 0)) { toast('Enter the amount'); return; }
    db.transactions.push({ id: uid(), created: Date.now(), type: 'income', paycheck: true, amount, catId: null, date: f.date.value, note: 'Paycheck' });
    save(); closeSheet(); render();
    toast(inPeriod(f.date.value, pk) ? `Paycheck saved · ${money(amount)}` : `Saved to ${periodLabel(periodOf(f.date.value))}`);
  });
}

/* Sync UI */
const SYNC_TEXT = {
  synced: 'Synced', pending: 'Saving to the cloud…', connecting: 'Connecting…',
  offline: 'Offline. Changes will sync when you are back online.',
  signedout: 'Not signed in', denied: "This account isn't allowed to open the shared budget."
};
function syncSection() {
  if (!Sync.enabled) return '';
  const u = Sync.user;
  return `<h4>Sync between phones</h4>
    ${u ? `<div class="set-row"><div class="grow"><div class="name">${esc(u.email)}</div><div class="sub">${esc(SYNC_TEXT[Sync.status] || '')}</div></div>
      <button class="btn sm" data-signout>Sign out</button></div>`
      : `<div class="set-row"><div class="grow"><div class="name">Not signed in</div><div class="sub">Sign in so you both see the same budget.</div></div>
      <button class="btn sm primary" data-signin>Sign in</button></div>`}`;
}
function signInSheet() {
  const root = openSheet(`<form id="f"><h2>Sign in to sync</h2>
    <div class="sub" style="margin-top:-8px">Use the email and password for your budget account.</div>
    <label class="field"><span>Email</span><input name="email" type="email" autocomplete="username" autocapitalize="off" required autofocus></label>
    <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
    <div class="err" id="signErr"></div>
    <button type="button" class="linkbtn" data-forgot>Forgot password?</button>
    <div class="actions"><span class="spacer"></span><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary" id="signBtn">Sign in</button></div></form>`);
  const f = root.querySelector('#f'), err = root.querySelector('#signErr'), btn = root.querySelector('#signBtn');
  wireCommon(root);
  root.querySelector('[data-forgot]').onclick = async () => {
    if (!f.email.value.trim()) { err.textContent = 'Type your email first.'; f.email.focus(); return; }
    try { await Sync.resetPassword(f.email.value); err.textContent = ''; toast('Check your email for a reset link'); }
    catch (e) { err.textContent = Sync.errorText(e); }
  };
  f.addEventListener('submit', async e => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = 'Signing in…'; err.textContent = '';
    try { await Sync.signIn(f.email.value, f.password.value); closeSheet(); toast('Signed in · syncing'); }
    catch (ex) { err.textContent = Sync.errorText(ex); btn.disabled = false; btn.textContent = 'Sign in'; }
  });
}
const SYNC_MARKS = { synced: 'M9.5 13.5l2 2 3.5-4', pending: 'M12 11v3.5', connecting: 'M12 11v3.5', offline: 'M9 11.5l6 4M15 11.5l-6 4', signedout: 'M12 10.5v3M12 16v.01', denied: 'M12 10.5v3M12 16v.01' };
function updateSyncBtn() {
  const btn = $('#syncBtn'), on = Sync.enabled;
  btn.hidden = !on; $('#syncSpacer').hidden = on;
  if (!on) return;
  const s = Sync.status;
  btn.dataset.s = s;
  $('#syncMark').setAttribute('d', SYNC_MARKS[s] || '');
  btn.setAttribute('aria-label', 'Sync: ' + (SYNC_TEXT[s] || s));
  btn.title = SYNC_TEXT[s] || s;
}
function syncBanner() {
  if (!Sync.enabled) return '';
  if (Sync.status === 'signedout') return `<section class="card banner"><div class="emoji" style="background:var(--card)">💞</div>
    <div class="grow"><b>Share this budget</b><span class="sub">Sign in so you both see the same numbers.</span></div>
    <button class="btn sm primary" data-act="signin">Sign in</button></section>`;
  if (Sync.status === 'denied') return `<section class="card banner" style="background:color-mix(in srgb,var(--danger) 12%,transparent)"><div class="grow"><b>Can't open the shared budget</b><span class="sub">This account isn't on the allowed list. Check the Firestore rules.</span></div></section>`;
  return '';
}

function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `budget-backup-${isoDate(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Backup saved to your downloads');
}
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.categories) || !Array.isArray(d.transactions)) throw new Error('bad');
      if (!confirm(`Restore this backup? It replaces ${Sync.live ? 'the shared budget for both of you' : "what's on this phone now"} (${d.transactions.length} entries, ${(d.bills || []).length} bills, ${(d.goals || []).length} goals).`)) return;
      db = normalize(d); save(); closeSheet(); render(); toast('Backup restored');
    } catch (err) { toast("That file isn't a budget backup"); }
  };
  r.readAsText(file);
});

/* ---------- Events ---------- */
$('#main').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'tab': setTab(el.dataset.tab); break;
    case 'settings': settingsSheet(); break;
    case 'signin': signInSheet(); break;
    case 'pay-calc': payForm(); break;
    case 'got-paid': gotPaidForm(); break;
    case 'filter': state.filterCat = id || 'none'; state.tab = 'spending'; try { localStorage.setItem(KEY + ':tab', 'spending'); } catch (_) {} render(); window.scrollTo(0, 0); break;
    case 'filter-chip': state.filterCat = id || null; render(); break;
    case 'add-tx': txForm(); break;
    case 'edit-tx': txForm(id); break;
    case 'toggle-bill': toggleBill(id); break;
    case 'add-bill': billForm(); break;
    case 'edit-bill': billForm(id); break;
    case 'add-goal': goalForm(); break;
    case 'edit-goal': goalForm(id); break;
    case 'fund-goal': fundGoal(id); break;
  }
});
document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#fab').addEventListener('click', () => ({ bills: billForm, goals: goalForm }[state.tab] || txForm)());
$('#prev').addEventListener('click', () => { state.pk = shiftPeriod(state.pk, -1); render(); });
$('#next').addEventListener('click', () => { state.pk = shiftPeriod(state.pk, 1); render(); });
$('#monthLabel').addEventListener('click', () => { if (state.pk !== thisPeriod()) { state.pk = thisPeriod(); render(); } });
$('#settingsBtn').addEventListener('click', settingsSheet);
$('#syncBtn').addEventListener('click', () => Sync.user ? settingsSheet() : signInSheet());
let lastSyncStatus = Sync.status;
Sync.onStatus(s => {
  updateSyncBtn();
  // Redraw when the sign-in banner should appear or disappear
  if ((s === 'signedout' || s === 'denied') !== (lastSyncStatus === 'signedout' || lastSyncStatus === 'denied')) render();
  lastSyncStatus = s;
});
// Refresh "today" if the app stays open across midnight / month change
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

render();
updateSyncBtn();
Sync.init();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
